<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeSpace — Check-In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Custom Cursor Element -->
  <div class="custom-cursor"></div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon"></span>
      <span class="logo-text">SafeSpace</span>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="nav-item">Home</a>
      <a href="check-in.html" class="nav-item active">Check-in</a>
      <a href="activities.html" class="nav-item">Activities</a>
      <button id="themeToggleBtn" class="nav-btn" aria-label="Toggle theme">Light Mode</button>
    </nav>
  </header>

  <!-- Check-In Content Section -->
  <main class="hero-container check-in-container">
    <h1 class="hero-title">Where's your mind at today?</h1>
    <p class="hero-description">Select the word that best fits how you're feeling right now.</p>

    <!-- Emotion Selection Grid -->
    <div class="emotion-grid">
      <button type="button" class="emotion-card" data-emotion="bright">
        <img id="bright_image" class="emotion-icon" src="images/bright.png" alt="Bright">
        <p>Bright</p>
      </button>

      <button type="button" class="emotion-card" data-emotion="steady">
        <img id="steady_image" class="emotion-icon" src="images/steady.png" alt="Steady">
        <p>Steady</p>
      </button>

      <button type="button" class="emotion-card" data-emotion="heavy">
        <img id="heavy_image" class="emotion-icon" src="images/heavy.png" alt="Heavy">
        <p>Heavy</p>
      </button>

      <button type="button" class="emotion-card" data-emotion="overloaded">
        <img id="overloaded_image" class="emotion-icon" src="images/overloaded.png" alt="Overloaded">
        <p>Overloaded</p>
      </button>
    </div>

    <button id="submitCheckInBtn" class="primary-btn" disabled>Continue</button>
    <button id="skipCheckInBtn" class="skip-btn" type="button">Skip for now</button>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>SAFESPACE</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
