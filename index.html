<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeSpace — Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Custom Cursor Element -->
  <div class="custom-cursor"></div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon"></span>
      <span class="logo-text">SafeSpace</span>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="nav-item active">Home</a>
      <a href="check-in.html" class="nav-item">Check-in</a>
      <a href="activities.html" class="nav-item">Activities</a>
      <button id="themeToggleBtn" class="nav-btn" aria-label="Toggle theme">Light Mode</button>
    </nav>
  </header>

  <!-- Main Hero Section -->
  <main class="hero-container">
    <div class="circle-graphic">
      <div class="inner-circle"></div>
    </div>

    <h1 class="hero-title">Take some time to rest</h1>
    
    <p class="hero-description">
      Check in with how you're feeling, and we'll shape the next few minutes around it — a breathing exercise, a little music, a place to write, or just a small game to be still with.
    </p>

    <button id="checkInBtn" class="primary-btn">Begin Check-In</button>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>SAFESPACE</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
